name: Déploiement Portfolio MkDocs

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [update-docs]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du Portfolio
        uses: actions/checkout@v7

      - name: Installation de Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Installation des dépendances
        run: pip install -r requirements.txt

      - name: Déploiement sur GitHub Pages
        env:
          AccessToken: ${{ secrets.GH_PAT }}  # Utilisé automatiquement par mkdocs-multirepo
        run: mkdocs gh-deploy --force
