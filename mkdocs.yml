site_name: Portfolio - Projets Robotique

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - multirepo:
      cleanup: true          # Supprime les fichiers temporaires clonés après le build
      keep_docs_dir: true    # Conserve le dossier docs/ principal de Portfolio
      repos:
        - section: Arduino & Registres
          import_url: https://github.com/Iakens/learning_arduino_with_registers/tree/main
          # Optionnel : si le dépôt n'a pas de mkdocs.yml et que vous voulez juste importer son dossier docs/ :
          # import_url: https://github.com&docs_dir=docs/*

nav:
  - Accueil: index.md
  # Le plugin injecte automatiquement la section "Arduino & Registres" dans la navigation !


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com
  - https://kicanvas.org
