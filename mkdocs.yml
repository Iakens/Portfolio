site_name: Portfolio - Projets Robotique & Embarqué
site_description: Documentation technique matérielle et logicielle

theme:
  name: material
  language: fr
  palette:
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - monorepo

nav:
  - Accueil: index.md
  - Arduino & Registres: '!include ./repos/learning_arduino_with_registers/mkdocs.yml'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com
  - https://kicanvas.org
