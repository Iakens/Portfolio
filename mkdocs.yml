site_name: Portfolio - Projets Robotique
repo_url: https://github.com/
repo_name: Iakens/Portfolio

theme:
  name: material
  language: fr
  icon:
    logo: material/robot-industrial
  palette:
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Passer en mode clair
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Passer en mode sombre
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - multirepo:
      cleanup: true          # Supprime les fichiers temporaires clonés après le build
      repos:
        # Optionnel : si le dépôt n'a pas de mkdocs.yml et que vous voulez juste importer son dossier docs/ :
        # import_url: https://github.com&docs_dir=docs/*
        - section: learning-arduino-registers
          import_url: git@github.com:Iakens/learning_arduino_with_registers?branch=main
        - section: esc-foc-single-motor
          import_url: git@github.com:Iakens/ESC_FOC_Single_Motor?branch=main


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

extra_javascript:
  - https://unpkg.com
  - path: javascript/kicanvas.js
    type: module

extra_css:
    - stylesheets/extra.css
